<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Control de Glucemia</title>
<meta name="theme-color" content="#155e63">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #F4F7F7;
    --surface: #FFFFFF;
    --ink: #16262A;
    --ink-soft: #5B6E71;
    --teal: #155E63;
    --teal-deep: #0D4448;
    --teal-soft: #E4EFEF;
    --amber: #D98C2B;
    --amber-soft: #FBEDD8;
    --red: #C4453E;
    --red-soft: #FBE6E4;
    --green: #3D8361;
    --green-soft: #E4F2EA;
    --line: #DCE6E6;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(13,68,72,0.06), 0 1px 2px rgba(13,68,72,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  h1,h2,h3,.num{font-family:'Manrope',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 8px;}

  header.top{
    background:linear-gradient(160deg,var(--teal) 0%, var(--teal-deep) 100%);
    color:#fff;
    padding:22px 16px 28px;
    border-radius:0 0 28px 28px;
    box-shadow:var(--shadow);
  }
  header.top .wrap{padding-top:0;padding-bottom:0;}
  header.top .eyebrow{font-size:13px;opacity:.8;letter-spacing:.02em;margin:0 0 2px;}
  header.top h1{font-size:22px;margin:0 0 16px;font-weight:800;}

  .latest-row{display:flex;gap:10px;}
  .latest-card{
    flex:1;background:rgba(255,255,255,0.12);
    border-radius:14px;padding:12px 14px;
    backdrop-filter:blur(2px);
  }
  .latest-card .label{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.04em;}
  .latest-card .num{font-size:26px;font-weight:800;margin-top:2px;line-height:1.1;}
  .latest-card .sub{font-size:12px;opacity:.85;margin-top:2px;}

  section.card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-top:16px;
  }
  section.card h2{font-size:15px;margin:0 0 12px;color:var(--teal-deep);font-weight:800;}

  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .card-head h2{margin:0;}
  .edit-link{border:none;background:none;color:var(--teal);font-size:13px;font-weight:700;cursor:pointer;padding:4px 6px;}

  .esquema-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .esquema-block{background:var(--teal-soft);border-radius:12px;padding:12px;}
  .esquema-block .titulo{font-size:11.5px;font-weight:800;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .esquema-block .nombre{font-size:13.5px;font-weight:700;margin-bottom:4px;}
  .esquema-block .detalle{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .esquema-doses{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .esquema-doses span{background:#fff;border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--teal-deep);}
  .esquema-nota{grid-column:1 / -1;background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#7A5217;line-height:1.5;}
  .esquema-monitoreo{grid-column:1 / -1;font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .esquema-monitoreo b{color:var(--ink);}
  .esquema-updated{grid-column:1 / -1;font-size:11px;color:#93A3A3;text-align:right;margin-top:-2px;}
  .escala-tabla{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
  .escala-tabla td{padding:4px 6px;border-bottom:1px solid rgba(21,94,99,0.12);}
  .escala-tabla td:last-child{text-align:right;font-weight:800;color:var(--teal-deep);}
  .alerta-banner{
    grid-column:1 / -1;background:var(--red-soft);color:var(--red);border-radius:12px;
    padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.5;
  }
  .insulina-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .insulina-row select{flex:1.2;border:1.5px solid var(--line);border-radius:11px;padding:11px 10px;font-size:14.5px;font-family:inherit;}
  .insulina-row input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:11px 10px;font-size:14.5px;font-family:inherit;}
  .insulina-row .quitar{flex:0 0 auto;border:none;background:none;color:#B9C4C4;font-size:19px;padding:4px 6px;cursor:pointer;}

  .vista-toggle{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px;}
  .vista-toggle button{flex:1;border:none;background:transparent;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;}
  .vista-toggle button.active{background:var(--teal);color:#fff;}

  .planilla-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.planilla{border-collapse:collapse;font-size:12px;white-space:nowrap;}
  table.planilla th, table.planilla td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  table.planilla th{background:var(--teal-soft);color:var(--teal-deep);font-weight:800;position:sticky;top:0;}
  table.planilla td.momento-label, table.planilla th.momento-label{
    position:sticky;left:0;background:#fff;text-align:left;font-weight:700;color:var(--ink);z-index:2;
    box-shadow:2px 0 4px rgba(0,0,0,0.04);
  }
  table.planilla th.momento-label{background:var(--teal-soft);z-index:3;}
  table.planilla .celda-gluc{font-weight:800;color:var(--teal-deep);}
  table.planilla .celda-gluc.alto{color:var(--amber);}
  table.planilla .celda-gluc.alerta{color:var(--red);}
  table.planilla .celda-ins{font-size:10.5px;color:var(--ink-soft);display:block;}
  table.planilla .celda-sensor{font-size:10.5px;color:#6A4C93;display:block;}
  table.planilla .celda-comida{font-size:10.5px;color:var(--green);display:block;font-style:italic;white-space:normal;max-width:140px;}

  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  .range-custom{display:none;gap:8px;margin-top:10px;}
  .range-custom.show{display:flex;}
  .range-custom input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .stat{background:var(--teal-soft);border-radius:12px;padding:10px;text-align:center;}
  .stat .num{font-size:19px;font-weight:800;color:var(--teal-deep);}
  .stat .label{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

  canvas#chart{margin-top:14px;max-height:220px;}

  .list{margin-top:8px;}
  .item{
    display:flex;align-items:center;gap:10px;
    padding:11px 4px;border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item .icon{
    width:38px;height:38px;border-radius:10px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  }
  .icon.gluc{background:var(--teal-soft);color:var(--teal-deep);}
  .icon.ins{background:var(--amber-soft);color:var(--amber);}
  .icon.sensor{background:#EDE7F6;color:#6A4C93;}
  .icon.comida{background:var(--green-soft);color:var(--green);}
  .item .info{flex:1;min-width:0;}
  .item .info .main{font-size:14.5px;font-weight:600;}
  .item .info .sub{font-size:12px;color:var(--ink-soft);}
  .item .value{font-size:16px;font-weight:800;font-family:'Manrope',sans-serif;}
  .value.alto{color:var(--amber);}
  .value.alerta{color:var(--red);}
  .value.ok{color:var(--green);}
  .item .del{border:none;background:none;color:#B9C4C4;font-size:18px;padding:4px 6px;cursor:pointer;}
  .item .del:hover{color:var(--red);}

  .empty{text-align:center;padding:24px 8px;color:var(--ink-soft);font-size:14px;}

  .export-row{display:flex;gap:10px;margin-top:14px;}
  .btn{
    flex:1;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Inter',sans-serif;
  }
  .btn.pdf{background:var(--red-soft);color:var(--red);}
  .btn.xls{background:var(--green-soft);color:var(--green);}

  .fab{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--teal);color:#fff;border:none;border-radius:999px;
    padding:14px 26px;font-size:15px;font-weight:800;box-shadow:0 6px 18px rgba(13,68,72,0.35);
    display:flex;align-items:center;gap:8px;cursor:pointer;z-index:20;font-family:'Inter',sans-serif;
  }

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(13,38,42,0.45);z-index:40;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:800;color:var(--teal-deep);}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px;}
  .seg button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;}
  .seg button.active{background:var(--teal);color:#fff;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select{
    width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--teal);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .save-btn{
    width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15.5px;font-weight:800;cursor:pointer;margin-top:6px;font-family:'Inter',sans-serif;
  }
  .cancel-link{display:block;text-align:center;margin-top:12px;color:var(--ink-soft);font-size:13.5px;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--teal-deep);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;
    opacity:0;transition:opacity .25s;z-index:50;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="eyebrow">Control diario</p>
    <h1 id="fechaHoy">Glucemia e insulina</h1>
    <div class="latest-row">
      <div class="latest-card">
        <div class="label">Última glucemia</div>
        <div class="num" id="ultGluc">—</div>
        <div class="sub" id="ultGlucSub">Sin registros</div>
      </div>
      <div class="latest-card">
        <div class="label">Última insulina</div>
        <div class="num" id="ultIns">—</div>
        <div class="sub" id="ultInsSub">Sin registros</div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="card" id="cardEsquema">
    <div class="card-head">
      <h2>Esquema indicado por la diabetóloga</h2>
      <button class="edit-link" id="btnEditarEsquema">✎ Editar</button>
    </div>
    <div id="esquemaContenido"><div class="empty">Cargando…</div></div>
  </section>

  <section class="card">
    <h2>Período</h2>
    <div class="filters" id="filtros">
      <button class="chip active" data-range="hoy">Hoy</button>
      <button class="chip" data-range="7d">7 días</button>
      <button class="chip" data-range="mes">Este mes</button>
      <button class="chip" data-range="3m">Últimos 3 meses</button>
      <button class="chip" data-range="custom">Rango personalizado</button>
    </div>
    <div class="range-custom" id="rangeCustom">
      <input type="date" id="desde">
      <input type="date" id="hasta">
    </div>

    <div id="alertaBanner"></div>

    <div class="stat-grid" id="statGrid">
      <div class="stat"><div class="num" id="statProm">—</div><div class="label">Promedio glucemia</div></div>
      <div class="stat"><div class="num" id="statRango">—</div><div class="label">Mín / Máx</div></div>
      <div class="stat"><div class="num" id="statIns">—</div><div class="label">Insulina total</div></div>
    </div>

    <canvas id="chart"></canvas>

    <div class="export-row">
      <button class="btn pdf" id="btnPdf">⬇ PDF</button>
      <button class="btn xls" id="btnXls">⬇ Excel</button>
    </div>
  </section>

  <section class="card">
    <h2>Registros</h2>
    <div class="vista-toggle" id="vistaToggle">
      <button data-vista="lista" class="active">Lista</button>
      <button data-vista="planilla">Planilla (como el papel)</button>
    </div>
    <div class="list" id="lista"><div class="empty">Cargando…</div></div>
    <div class="planilla-wrap" id="planillaWrap" style="display:none;"></div>
  </section>

</div>

<button class="fab" id="btnNuevo">＋ Registrar</button>

<div class="sheet-overlay" id="overlay">
  <div class="sheet">
    <h3>Nuevo registro</h3>

    <div class="row2">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fFecha">
      </div>
      <div class="field">
        <label>Hora</label>
        <input type="time" id="fHora">
      </div>
    </div>

    <div class="field">
      <label>Momento del día</label>
      <select id="fMomento">
        <option>Antes desayuno</option>
        <option>Antes almuerzo</option>
        <option>Después almuerzo</option>
        <option>Antes cena</option>
        <option>Después cena</option>
        <option>Otro</option>
      </select>
    </div>

    <div class="field">
      <label>Glucemia capilar — dedo (mg/dL) — opcional</label>
      <input type="number" id="fValor" placeholder="Ej: 110" inputmode="numeric">
      <div id="hintCorreccion" style="font-size:12px;margin-top:5px;color:var(--ink-soft);"></div>
    </div>

    <div class="field">
      <label>Sensor FreeStyle Libre (mg/dL) — opcional</label>
      <input type="number" id="fValorSensor" placeholder="Ej: 105" inputmode="numeric">
    </div>

    <label style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">Insulina — opcional (podés cargar más de una en el mismo momento)</label>
    <div id="insulinaRows"></div>
    <button type="button" id="btnAgregarInsulina" style="border:1.5px dashed var(--line);background:none;color:var(--teal);font-weight:700;font-size:13px;border-radius:11px;padding:9px;width:100%;cursor:pointer;margin-bottom:12px;">＋ Agregar otra insulina</button>

    <div class="field">
      <label>🍽 Comida — qué comió (opcional)</label>
      <input type="text" id="fComida" placeholder="Ej: tostadas integrales con queso y café con leche">
    </div>

    <div class="field">
      <label>Observaciones (opcional)</label>
      <input type="text" id="fObs" placeholder="Ej: después de caminar">
    </div>

    <button class="save-btn" id="btnGuardar">Guardar registro</button>
    <button class="cancel-link" id="btnCancelar">Cancelar</button>
  </div>
</div>

<div class="sheet-overlay" id="overlayEsquema">
  <div class="sheet">
    <h3>Esquema indicado</h3>

    <div class="field"><label>Insulina basal — nombre</label><input type="text" id="eBasalNombre"></div>
    <div class="row2">
      <div class="field"><label>Dosis (UI)</label><input type="number" id="eBasalDosis"></div>
      <div class="field"><label>Horario</label><input type="text" id="eBasalHorario"></div>
    </div>
    <div class="field"><label>Objetivo en ayunas</label><input type="text" id="eBasalObjetivo" placeholder="Ej: 80-130 mg/dL"></div>

    <div class="field"><label>Insulina prandial — nombre</label><input type="text" id="ePrandialNombre"></div>
    <div class="field"><label>Indicación</label><input type="text" id="ePrandialIndicacion"></div>
    <div class="field">
      <label>Escala de corrección (una línea por rango: "desde-hasta: unidades")</label>
      <textarea id="eEscalaCorreccion" rows="6" style="width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical;"></textarea>
    </div>
    <div class="row2">
      <div class="field"><label>Avisar si glucemia &lt;</label><input type="number" id="eAlertaBajo"></div>
      <div class="field"><label>Avisar si glucemia &gt;</label><input type="number" id="eAlertaAlto"></div>
    </div>

    <div class="field"><label>Medicación vía oral — nombre</label><input type="text" id="eMedOralNombre"></div>
    <div class="field"><label>Esquema</label><input type="text" id="eMedOralEsquema"></div>

    <div class="field"><label>Nota (omisión de comidas, etc.)</label><input type="text" id="eNotaOmision"></div>
    <div class="field"><label>Monitoreo</label><input type="text" id="eMonitoreo"></div>
    <div class="field"><label>Nota general (dieta, hidratación, etc.)</label><input type="text" id="eNotaGeneral"></div>

    <button class="save-btn" id="btnGuardarEsquema">Guardar esquema</button>
    <button class="cancel-link" id="btnCancelarEsquema">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
